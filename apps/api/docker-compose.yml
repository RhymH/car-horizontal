services:
  db_carhorizontal:
    image: postgres:17
    container_name: carhorizontal-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: db_carhorizontal
      POSTGRES_USER: chdbuser
      POSTGRES_PASSWORD: ch_local_dev
    volumes:
      - carhorizontal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chdbuser -d db_carhorizontal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  carhorizontal-pgdata:
